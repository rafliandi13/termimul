name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

env:
  WAILS_VERSION: v2.17.0

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # main.go embeds frontend/dist, so the frontend must be built before Go compiles.
      - run: npm ci && npm run check && npm run build
        working-directory: frontend
      # Tests don't touch the GUI, so the desktop libraries aren't needed here.
      - run: go test ./...

  windows:
    needs: test
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails and NSIS
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
      - run: wails build -nsis -trimpath -ldflags "-s -w"

      # Code signing via SignPath Foundation (see CODE_SIGNING.md). Runs only for
      # release tags once the SIGNPATH_API_TOKEN secret exists; otherwise the
      # unsigned build above is published as before.
      - name: Decide whether to sign
        id: sign
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* && -n "$SIGNPATH_API_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping code signing (not a release tag, or SIGNPATH_API_TOKEN not set)"
          fi

      # 1. Sign the app itself, replacing build/bin/termimus.exe.
      - id: upload-exe
        if: steps.sign.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: build/bin/termimus.exe
      - if: steps.sign.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'termimus' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600 # release signing waits for manual approval
          output-artifact-directory: build/bin

      # 2. Rebuild the installer around the signed exe (same command Wails runs), then sign it.
      - name: Rebuild installer with signed exe
        if: steps.sign.outputs.enabled == 'true'
        working-directory: build/windows/installer
        run: makensis "-DARG_WAILS_AMD64_BINARY=${{ github.workspace }}\build\bin\termimus.exe" project.nsi
      - id: upload-installer
        if: steps.sign.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: build/bin/termimus-amd64-installer.exe
      - if: steps.sign.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'termimus' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/bin

      - name: Name artifacts
        run: |
          Move-Item build/bin/termimus-amd64-installer.exe dist-termimus-windows-amd64-installer.exe
          Move-Item build/bin/termimus.exe dist-termimus-windows-amd64-portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-*

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - run: wails build -platform darwin/universal -trimpath -ldflags "-s -w"
      - name: Package .dmg
        run: |
          mkdir -p dmg
          cp -R build/bin/*.app dmg/Termimus.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname Termimus -srcfolder dmg -ov -format UDZO dist-termimus-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist-*

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install GTK / WebKit
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails and nfpm
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      # webkit2_41: Ubuntu 24.04+ / Debian 13 only ship WebKitGTK 4.1.
      - run: wails build -platform linux/amd64 -tags webkit2_41 -trimpath -ldflags "-s -w"
      - name: Package .deb and .tar.gz
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0~dev${GITHUB_RUN_NUMBER}"; fi
          export VERSION
          nfpm package --config build/linux/nfpm.yaml --packager deb --target dist-termimus-linux-amd64.deb
          mkdir -p tar/termimus
          cp build/bin/termimus build/linux/termimus.desktop build/linux/termimus.png LICENSE tar/termimus/
          tar -czf dist-termimus-linux-amd64.tar.gz -C tar termimus
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Strip build prefix
        run: for f in dist-*; do mv "$f" "${f#dist-}"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: termimus-*
          generate_release_notes: true
